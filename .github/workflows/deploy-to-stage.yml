name: Deploy to stage

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Checkout translations repository
        uses: actions/checkout@v4
        with:
          repository: uaukrstat/sdg-translations
          ref: stage
          path: translations-repo
          persist-credentials: false

      - name: Copy translations
        run: |
          rm -rf translations
          mkdir -p translations
          cp -R translations-repo/translations/* translations/
          rm -rf _data/translations
          mkdir -p _data/translations
          cp -R translations-repo/translations/* _data/translations/

      - name: Force Staging Config
        run: |
          echo "Force overwriting site_config for staging..."
          cp _data/site_config_staging.yml _data/site_config.yml
          cp _config_stage.yml _config.yml

      - name: Set up Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Ultimate Debug - What does Jekyll see?
        run: |
          echo "=== 1. Checking the content of _config.yml after copy ==="
          grep "remote_data_prefix" _config.yml
          
          echo "=== 2. Checking the content of _data/site_config.yml after copy ==="
          grep "remote_data_prefix" _data/site_config.yml
          
          echo "=== 3. List all files in _data to see if there are hidden configs ==="
          ls -F _data/

      - name: Build the site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build

      - name: Hotfix - Force replace URL in built files
        run: |
          echo "Replacing main with stage in all HTML files..."
          find _site -type f -name "*.html" -exec sed -i 's|data-ukraine-sdg/en|data-ukraine-sdg/stage/en|g' {} +
          find _site -type f -name "*.html" -exec sed -i 's|data-ukraine-sdg/uk|data-ukraine-sdg/stage/uk|g' {} +
          find _site -type f -name "*.html" -exec sed -i 's|data-ukraine-sdg/"|data-ukraine-sdg/stage/"|g' {} +

      - name: Debug - Real check
        run: |
          echo "=== Search for the URL after Hotfix ==="
          grep -r "remoteDataBaseUrl" _site/ | head -n 5

      - name: Debug - Real check
        run: |
          echo "=== Where are the files? ==="
          ls -F _site/
          echo "=== Search for the URL in the whole build ==="
          grep -r "remoteDataBaseUrl" _site/ | head -n 5

      - name: Prepare stage folder
        run: |
          rm -rf temp_dist
          mkdir -p temp_dist/stage
          cp -r _site/* temp_dist/stage/
          touch temp_dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: temp_dist
          CLEAN: false
